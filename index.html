<!DOCTYPE html>

        <div class="time two">
          <div class="eleman"></div>

        <div class="time four">
          <div class="eleman"></div>
          <div class="a"></div>
          <div class="b">غروب</div>
        </div>
        <div class="time five">
          <div class="eleman"></div>
          <div class="a"></div>

        </div>
        <div class="time six">
          <div class="eleman"></div>
          <div class="a"></div>
          <div class="b">نیمه شب</div>
        </div>
      </div>
